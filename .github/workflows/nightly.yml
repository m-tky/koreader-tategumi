        with:
          name: pocketbookhf
          path: |
            koreader-pocketbookhf-latest-nightly.zip
            koreader-pocketbookhf-latest-nightly.targz
            koreader-*.tar.xz

  cervantes:
    name: Cervantes
    needs: check-changes
    if: needs.check-changes.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    container:
      image: koreader/kocervantes:latest
    env:
