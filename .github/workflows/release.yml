            koreader-cervantes-latest-stable.zip
            koreader-cervantes-latest-stable.targz
            koreader-*.tar.xz

  remarkable:
    name: reMarkable (armhf)
    runs-on: ubuntu-latest
    container:
      image: koreader/koremarkable:latest
    env:
