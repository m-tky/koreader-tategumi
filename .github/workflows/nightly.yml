      - name: Fetch submodules
        run: make fetchthirdparty
      - name: Build
        run: bash .github/scripts/retry-build.sh make TARGET=android ANDROID_ARCH=arm64
      - name: Package
        run: make TARGET=android ANDROID_ARCH=arm64 update
      - name: Sign APK
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > /tmp/release.keystore
          APKSIGNER=$(find "${ANDROID_HOME}/build-tools" -name apksigner | sort -V | tail -1)
          "${APKSIGNER}" sign \
            --ks /tmp/release.keystore \
            --ks-pass "pass:${{ secrets.ANDROID_STORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.ANDROID_KEY_PASSWORD }}" \
            --ks-key-alias "${{ secrets.ANDROID_KEY_ALIAS }}" \
            koreader-android-arm64-*.apk
          rm -f /tmp/release.keystore
      - name: Rename for nightly
        run: cp koreader-android-arm64-*.apk koreader-android-arm64-latest-nightly.apk || true
      - uses: actions/upload-artifact@v4
        with:
          name: android-arm64
          path: koreader-android-arm64-latest-nightly.apk

  publish:
    name: Publish Nightly
    needs: [check-changes, ffi-cdefs, kindle, kindlehf, kindlepw2, kobo, pocketbook, pocketbookhf, cervantes, remarkable, remarkable-aarch64, android-arm, android-arm64]
    if: needs.check-changes.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch kotasync source
        run: git submodule update --init --recursive base

      - name: Set nightly version (YYYY.MM.DD)
        # Use the version computed in check-changes so we agree with what the
        # build jobs embedded via RELEASE_TAG (otherwise OTA Filename and the
        # tarball's git-rev would diverge if the build crossed UTC midnight).
        run: echo "NIGHTLY_VERSION=${{ needs.check-changes.outputs.nightly_version }}" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Convert ZIPs to OTA archives
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y p7zip-full
          bash .github/scripts/convert-ota-assets.sh artifacts nightly "$NIGHTLY_VERSION"

      - name: Create OTA aliases and versioned copies
        run: |
          VER=$NIGHTLY_VERSION
          # kobov5: same binary as kobo
          cp artifacts/kobo/koreader-kobo-latest-nightly.zip \
             artifacts/kobo/koreader-kobov5-latest-nightly.zip
          cp artifacts/kobo/koreader-kobo-latest-nightly.targz \
             artifacts/kobo/koreader-kobov5-latest-nightly.targz
          # kindle-legacy: same binary as kindle
          cp artifacts/kindle/koreader-kindle-latest-nightly.zip \
             artifacts/kindle/koreader-kindle-legacy-latest-nightly.zip
          cp artifacts/kindle/koreader-kindle-latest-nightly.targz \
             artifacts/kindle/koreader-kindle-legacy-latest-nightly.targz
          # Versioned copies of all zip/targz files
          for f in artifacts/**/*-latest-nightly.zip artifacts/**/*-latest-nightly.targz; do
            cp "$f" "${f/latest-nightly/$VER}"
          done
          # Versioned APK copies
          for f in artifacts/**/*-latest-nightly.apk; do
            cp "$f" "${f/latest-nightly/$VER}" 2>/dev/null || true
          done
          # Android "link" type OTA index files (first line = APK filename to download)
          echo "koreader-android-arm64-$VER.apk" \
            > artifacts/android-arm64/koreader-android-arm64-latest-nightly
          echo "koreader-android-$VER.apk" \
            > artifacts/android-arm/koreader-android-latest-nightly

      - name: Generate zsync files
        run: |
          # zsync Filename header = versioned name → parsed for version comparison.
          # zsync URL header = latest-nightly.targz → always downloadable at fixed URL.
          sudo apt-get update -qq && sudo apt-get install -y zsync
          VER=$NIGHTLY_VERSION
          shopt -s globstar
          for f in artifacts/**/*-"$VER".targz; do
            name=$(basename "$f")
            nightly_name="${name/$VER/latest-nightly}"
            dir=$(dirname "$f")
            zsyncmake -u "$OTA_BASE_URL/$nightly_name" \
              -o "$dir/${nightly_name%.targz}.zsync" \
              "$f"
          done
          # Versioned zsync copies
          for f in artifacts/**/*-latest-nightly.zsync; do
            cp "$f" "${f/latest-nightly/$VER}"
          done

      - name: Build kotasync manifest tool
        run: |
          # kotasync shares KOReader's third-party build setup, which requires
          # Meson even though the resulting AppRun is only used for manifests.
          sudo apt-get update -qq && sudo apt-get install -y meson
          make -C base/kotasync appdir
          KOTASYNC=$(find "$PWD/base/kotasync/build" -path '*/AppDir/AppRun' -type f -print -quit)
          test -n "$KOTASYNC"
          echo "KOTASYNC=$KOTASYNC" >> "$GITHUB_ENV"

      - name: Generate kotasync files
        run: |
          set -euo pipefail
          VER=$NIGHTLY_VERSION
          shopt -s globstar
          # Converted archives use the shared nightly version without a date suffix.
          cp "artifacts/kobo/koreader-kobo-$VER.tar.xz" "artifacts/kobo/koreader-kobov5-$VER.tar.xz"
          cp "artifacts/kindle/koreader-kindle-$VER.tar.xz" "artifacts/kindle/koreader-kindle-legacy-$VER.tar.xz"
          for package in artifacts/**/*.tar.xz; do
            name=$(basename "$package")
            latest_name="${name%%-"${VER}"*}-latest-nightly.kotasync"
            "$KOTASYNC" make "$package" "$(dirname "$package")/$latest_name"
          done

      - name: List artifacts
        run: find artifacts/ -type f | sort

      - name: Delete previous nightly release and tag
        run: |
          gh release delete nightly --cleanup-tag --yes 2>/dev/null || true
          sleep 3

      - name: Create nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: "koreader-tategumi nightly (${{ env.NIGHTLY_VERSION }})"
          prerelease: true
          make_latest: false
          body: |
            Automatic nightly build — ${{ env.NIGHTLY_VERSION }} — commit [${{ github.sha }}](https://github.com/m-tky/koreader-tategumi/commit/${{ github.sha }})

            To enable nightly OTA updates, open KOReader and go to:
            **Menu → Update → Settings → Update channel → Development**
          files: artifacts/**/*
