name: Sync from upstream koreader

on:
  schedule:
    - cron: '0 9 * * 5' # Friday at 09:00 UTC (18:00 JST)
  workflow_dispatch:

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # A PAT with the workflow permission is required if upstream changes
          # a workflow file.
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}

      - name: Configure git
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Fetch upstream and create a candidate branch
        env:
          BRANCH: upstream-sync/master
        run: |
          git remote add upstream https://github.com/koreader/koreader.git
          git fetch upstream master
          git fetch origin master
          git switch --create "$BRANCH" origin/master

      - name: Merge upstream while retaining fork-owned pins
        id: merge
        env:
          BRANCH_BASE: origin/master
        run: |
          set +e
          git merge upstream/master --no-edit
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            # The fork owns these pins; accept our side only when they conflict.
            for path in .gitmodules base test; do
              if git ls-files -u -- "$path" | grep -q .; then
                git checkout --ours -- "$path"
                git add -- "$path"
              fi
            done

            unresolved="$(git diff --name-only --diff-filter=U)"
            if [ -n "$unresolved" ]; then
              {
                echo 'unresolved<<EOF'
                echo "$unresolved"
                echo EOF
              } >> "$GITHUB_OUTPUT"
              git merge --abort
              exit 0
            fi
            git commit --no-edit
          fi

          # Upstream must never replace the fork's base/test/gitmodules pins.
          git checkout "$BRANCH_BASE" -- .gitmodules base test
          if ! git diff --cached --quiet; then
            git commit -m "sync: retain tategumi submodule pins"
          fi
          echo 'unresolved=' >> "$GITHUB_OUTPUT"

      - name: Report unresolved conflicts
        if: steps.merge.outputs.unresolved != ''
        env:
          # The sync PAT is scoped for repository contents so it can push
          # upstream workflow changes. Use the job token for Issues API calls.
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Upstream sync requires resolution ($(date -u +%F))" \
            --body "The automatic candidate could not resolve these conflicts after retaining the fork-owned pins:\n\n\`\`\`text\n${{ steps.merge.outputs.unresolved }}\n\`\`\`"

      - name: Push candidate and create or update pull request
        if: steps.merge.outputs.unresolved == ''
        env:
          # checkout persists the sync PAT for git push. The PAT has no Pull
          # requests scope, so use the explicitly permitted job token here.
          GH_TOKEN: ${{ github.token }}
          BRANCH: upstream-sync/master
        run: |
          if git diff --quiet origin/master...HEAD; then
            echo "Already up to date with upstream."
            exit 0
          fi
          git push --force-with-lease origin "$BRANCH"
          existing="$(gh api --method GET "repos/$GITHUB_REPOSITORY/pulls" \
            -f state=open \
            -f base=master \
            -f head="$GITHUB_REPOSITORY_OWNER:$BRANCH" \
            --jq '.[0].html_url // empty')"
          if [ -n "$existing" ]; then
            echo "Updating existing pull request: $existing"
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/pulls" \
              -f base=master \
              -f head="$BRANCH" \
              -f title="Upstream sync: koreader/koreader" \
              -f body="Automated candidate merge from upstream. Fork-owned submodule pins are retained; merge this PR only after CI and review pass." \
              --jq .html_url
          fi
