name: Release builds

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v2025.05)'
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  MAKEFLAGS: "PARALLEL_JOBS=3 OUTPUT_DIR=build"
  OTA_BASE_URL: "https://github.com/m-tky/koreader-tategumi/releases/latest/download"
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}

jobs:

  ffi-cdefs:
    name: LuaJIT FFI declarations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          submodules: recursive
      - name: Load every platform C definition with LuaJIT
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y luajit
          for platform in android_arm android_arm64 android_x64 android_x86 linux_arm linux_arm64 linux_x64 macos; do
            cdef="base/ffi-cdecl/posix_h_${platform}.lua"
            echo "Checking $cdef"
            luajit "$cdef"
          done

  kindle:
    name: Kindle
    runs-on: ubuntu-latest
    container:
      image: koreader/kokindle:latest
    env:
      BASH_ENV: /home/ko/.bashrc
      TARGET: kindle
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Fetch submodules
        run: make fetchthirdparty
      - name: Build
        run: make TARGET=kindle
      - name: Package
        run: make TARGET=kindle update
      - name: Rename for release
        run: |
          cp koreader-kindle-*.zip koreader-kindle-latest-stable.zip || true
          cp koreader-kindle-*.targz koreader-kindle-latest-stable.targz || true
      - uses: actions/upload-artifact@v4
        with:
          name: kindle
          path: |
            koreader-kindle-latest-stable.zip
            koreader-kindle-latest-stable.targz
            koreader-*.tar.xz

  kindlehf:
    name: Kindle (HF)
    runs-on: ubuntu-latest
    container:
      image: koreader/kokindle:latest
