name: Nightly builds

on:
  schedule:
    - cron: '0 20 * * *'   # 05:00 JST daily
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  MAKEFLAGS: "PARALLEL_JOBS=3 OUTPUT_DIR=build"
  # OTA base URL for nightly zsync — points to the 'nightly' tagged release.
  # (Cannot use /releases/latest because nightly is a prerelease.)
  OTA_BASE_URL: "https://github.com/m-tky/koreader-tategumi/releases/download/nightly"

jobs:

  check-changes:
    name: Check for source changes
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      nightly_version: ${{ steps.version.outputs.nightly_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check changes since last nightly
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual trigger — building unconditionally."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch origin --tags --quiet
          LAST=$(git rev-list -1 nightly 2>/dev/null || echo "")
          if [ -z "$LAST" ]; then
            echo "No previous nightly tag — building."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(git diff --name-only "$LAST" HEAD | \
            grep -E '^(frontend/|plugins/|base$|test$|resources/|reader\.lua$|Makefile$|CMakeLists\.txt$|kodev$|.*\.lua$)' || true)
          if [ -n "$CHANGED" ]; then
            echo "Source changes detected:"
            echo "$CHANGED"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "No source changes since last nightly — skipping build."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Compute nightly version
        id: version
        # Shared across all build/publish jobs so the embedded git-rev and the
        # OTA zsync Filename header agree. Otherwise OTAManager parses two
        # different version strings and offers an update on every check.
        run: echo "nightly_version=v$(date -u +%Y.%m.%d)-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  ffi-cdefs:
    name: LuaJIT FFI declarations
    needs: check-changes
    if: needs.check-changes.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Load every platform C definition with LuaJIT
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y luajit
          for platform in android_arm android_arm64 android_x64 android_x86 linux_arm linux_arm64 linux_x64 macos; do
            cdef="base/ffi-cdecl/posix_h_${platform}.lua"
            echo "Checking $cdef"
            luajit "$cdef"
          done

  kindle:
    name: Kindle
    needs: check-changes
    if: needs.check-changes.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    container:
      image: koreader/kokindle:latest
    env:
      BASH_ENV: /home/ko/.bashrc
      TARGET: kindle
      RELEASE_TAG: ${{ needs.check-changes.outputs.nightly_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch submodules
        run: make fetchthirdparty
      - name: Build
        run: make TARGET=kindle
      - name: Package
        run: make TARGET=kindle update
      - name: Rename for nightly
        run: |
          cp koreader-kindle-*.zip koreader-kindle-latest-nightly.zip || true
          cp koreader-kindle-*.targz koreader-kindle-latest-nightly.targz || true
      - uses: actions/upload-artifact@v4
        with:
          name: kindle
          path: |
            koreader-kindle-latest-nightly.zip
            koreader-kindle-latest-nightly.targz
            koreader-*.tar.xz

  kindlehf:
    name: Kindle (HF)
    needs: check-changes
    if: needs.check-changes.outputs.should_build == 'true'
