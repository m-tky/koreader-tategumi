  pocketbookhf:
    name: PocketBook (HF)
    needs: check-changes
    if: needs.check-changes.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    container:
      image: koreader/kopb:2.1.0-22.04
    env:
