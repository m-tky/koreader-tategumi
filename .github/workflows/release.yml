        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Fetch submodules
        run: make fetchthirdparty
      - name: Build
        run: make TARGET=android ANDROID_ARCH=arm64
      - name: Package
        run: make TARGET=android ANDROID_ARCH=arm64 update
      - name: Sign APK
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > /tmp/release.keystore
          APKSIGNER=$(find "${ANDROID_HOME}/build-tools" -name apksigner | sort -V | tail -1)
          "${APKSIGNER}" sign \
            --ks /tmp/release.keystore \
            --ks-pass "pass:${{ secrets.ANDROID_STORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.ANDROID_KEY_PASSWORD }}" \
            --ks-key-alias "${{ secrets.ANDROID_KEY_ALIAS }}" \
