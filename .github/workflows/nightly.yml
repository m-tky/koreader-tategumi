      - name: Fetch submodules
        run: make fetchthirdparty
      - name: Build
        run: make TARGET=pocketbookhf
      - name: Package
        run: make TARGET=pocketbookhf update
      - name: Rename for nightly
        run: |
          cp koreader-pocketbookhf-*.zip koreader-pocketbookhf-latest-nightly.zip || true
          cp koreader-pocketbookhf-*.targz koreader-pocketbookhf-latest-nightly.targz || true
