        with:
          fetch-depth: 0
      - name: Fetch submodules
        run: make fetchthirdparty
      - name: Build
        run: make TARGET=pocketbook
      - name: Package
        run: make TARGET=pocketbook update
      - name: Rename for nightly
        run: |
          cp koreader-pocketbook-*.zip koreader-pocketbook-latest-nightly.zip || true
          cp koreader-pocketbook-*.targz koreader-pocketbook-latest-nightly.targz || true
      - uses: actions/upload-artifact@v4
        with:
          name: pocketbook
          path: |
            koreader-pocketbook-latest-nightly.zip
            koreader-pocketbook-latest-nightly.targz
            koreader-*.tar.xz

  pocketbookhf:
    name: PocketBook (HF)
    needs: check-changes
    if: needs.check-changes.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    container:
      image: koreader/kopb:latest
    env:
      BASH_ENV: /home/ko/.bashrc
      TARGET: pocketbookhf
      RELEASE_TAG: ${{ needs.check-changes.outputs.nightly_version }}
    steps:
